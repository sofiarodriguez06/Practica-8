<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon - Página Principal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f3f3f3; }
        header { background-color: #131921; color: white; padding: 10px 20px; }
        header h1 { margin: 0; color: #ff9900; display: inline-block; }
        nav { background-color: #232f3e; padding: 10px 20px; }
        nav a { color: white; text-decoration: none; margin-right: 15px; }
        main { padding: 20px; max-width: 900px; margin: auto; }
        .grid { display: flex; gap: 15px; margin-bottom: 20px; }
        .tarjeta { background: white; padding: 10px; border-radius: 5px; text-align: center; flex: 1; }
        .tarjeta img { width: 100%; height: 120px; object-fit: cover; }
        .formulario-box { background: white; padding: 20px; border-radius: 5px; }
        footer { background-color: #131921; color: white; text-align: center; padding: 15px; margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>amazon</h1>
    </header>

    <nav>
        <a href="#">Todo</a>
        <a href="#">Ofertas del Día</a>
        <a href="#">Servicio al Cliente</a>
        <a href="#">Listas</a>
    </nav>

    <main>
        <h2>Categorías Destacadas</h2>
        
        <div class="grid">
            <div class="tarjeta">
                <h3>Cocina</h3>
                <img src="cocina.jpg" alt="Cocina">
            </div>
            <div class="tarjeta">
                <h3>Belleza</h3>
                <img src="belleza.jpg" alt="Belleza">
            </div>
            <div class="tarjeta">
                <h3>Laptops</h3>
                <img src="laptops.jpg" alt="Laptops">
            </div>
        </div>

        <div class="formulario-box">
            <h2>Formulario de Inicio de Sesión</h2>
            <form action="" method="post">
                Ingresa tu usuario: <br>
                <input type="text" name="usuario">
                <br><br>
                Ingresa tu contraseña: <br>
                <input type="password" name="pass">
                <br><br>
                <input type="submit" value="enviar">
                <input type="reset" value="borrar">
            </form>
        </div>
    </main>

    <footer>
        <p> SOFIA RODRIGUEZ HERNANDEZ -0653 </p>
    </footer>

</body>
</html>
